name: paper-chain

# ══════════════════════════════════════════════════════════════════════════════
#  常驻链（和 meter_monitor 的 main.yml + main.py 同一套架构）
#
#  cron 是 best-effort：会晚几十分钟到几小时，也会整次丢弃，没有任何保证。
#  所以真正的「准点」不能寄托在 cron 上，而是——
#
#      只要有一个进程在 14:50 之前就已经活着，并且它自己数到了 14:50，
#      准点就和 cron 无关了。
#
#  ┌───────────────────────────────────────────────────────────────┐
#  │  cron（兜底拉起，链断了靠它爬起）                              │
#  └───────────────────────────┬───────────────────────────────────┘
#                              ▼
#  ┌───────────────────────────────────────────────────────────────┐
#  │  runner_loop.py   跑 5h45m，每分钟看一次表                      │
#  │    · 14:50 到点 → 子进程跑 paper_trade.py（正式盘 + 测试盘）    │
#  │    · 09:00~09:29（每月 1~3 号）→ 盘前补跑正式盘                 │
#  │    · 每次触发后 git commit + push                              │
#  │    · 跑满 345 分钟 → exit(0) 主动交棒                          │
#  └───────────────────────────┬───────────────────────────────────┘
#                              ▼
#  ┌───────────────────────────────────────────────────────────────┐
#  │  Trigger Next Workflow：用 PAT 调 dispatch API 触发下一轮 ─────┼──┐
#  └───────────────────────────────────────────────────────────────┘  │
#                              ▲──────────────────────────────────────┘
#
#  为什么必须用 PAT：GitHub 规定「由 GITHUB_TOKEN 产生的 dispatch 不会再
#  运行新 workflow」（防无限递归）。所以接力必须用 secrets.PAT_TOKEN。
#
#  接力条件是 if: success()：Python 主动 exit(0) 才交棒。
#  如果 Python 崩了（非 0 退出），**不交棒**——否则一个系统性 bug 会变成
#  无限崩溃循环。这种情况由 cron 在 13:00 / 17:40 / 08:10 重新拉起。
#
#  数据目录（GITHUB_TOKEN 不允许写 .github/workflows/**，所以数据必须放仓库根）：
#    paper/            正式盘
#    paper_test/       测试盘
#    chain_state.json  今天到底跑过没（跨 job 接力靠它去重）
# ══════════════════════════════════════════════════════════════════════════════
on:
  schedule:
    # 兜底：链断了靠这三次把循环重新拉起来。13:00 那次最关键 ——
    # 它在 14:50 前 110 分钟起跑，新拉起的循环有充足时间等到 14:50。
    - cron: '0 5 * * *'       # 13:00 北京时间
    - cron: '40 9 * * *'      # 17:40 北京时间（链断且已过 14:50 → 起来立刻补跑）
    - cron: '10 0 1-3 * *'    # 08:10 北京时间，仅每月 1~3 号（盘前补跑兜底）
  workflow_dispatch:
    inputs:
      max_run:
        description: '本次循环秒数（测试用，留空=20700 即 5h45m）'
        required: false
        default: ''
      run_now:
        description: '立刻跑一次主触发，不等 14:50（手动补跑用）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-chain
  cancel-in-progress: false

env:
  # runner 默认 UTC。不设成北京时间，14:50 会被当成 14:50 UTC，整天错 8 小时。
  TZ: Asia/Shanghai
  PORTFOLIOS: "5 10"
  CAND: "20"
  CAPITAL: "200000"
  WINDOW: "20"
  CUT: "2"

jobs:
  run-loop:
    runs-on: ubuntu-latest
    # 平台单 job 硬上限 6 小时。runner_loop.py 在 5h45m 主动 exit(0) 交棒，
    # 这里的 timeout 只是防止 Python 卡死时被平台强杀。
    timeout-minutes: 350

    steps:
      - name: Checkout（保留完整历史，便于 rebase 推送）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Run runner_loop.py
        env:
          MAX_RUN: ${{ github.event.inputs.max_run }}
          RUN_NOW: ${{ github.event.inputs.run_now }}
          # 推送用 PAT：仓库若把 Workflow 权限设成只读，GITHUB_TOKEN 推不上去，
          # 而 YAML 里的 permissions 只能降权不能提权。只传进环境变量，不打印。
          GH_PUSH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${MAX_RUN}" ]; then ARGS="--max-run ${MAX_RUN}"; fi
          if [ "${RUN_NOW}" = "true" ]; then ARGS="${ARGS} --run-now"; fi
          echo "启动参数: ${ARGS:-（默认 5h45m，14:50 主触发）}"
          if [ -n "${GH_PUSH_TOKEN}" ]; then
            echo "推送凭证: secrets.PAT_TOKEN"
          else
            echo "::warning::没有 PAT_TOKEN，推送退回到 GITHUB_TOKEN（可能只读）"
          fi
          python -u runner_loop.py ${ARGS}

      - name: Commit data（兜底提交）
        # runner_loop.py 每次触发后都会自己提交；这里补上它没管的（以及收尾瞬间的状态），
        # 确保本轮结束前一定落盘一次。
        if: success()
        run: |
          set -euo pipefail
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"

          DIRS=""
          PATHS=""
          for R in paper paper_test; do
            if [ -d "$R" ]; then DIRS="${DIRS:+$DIRS,}$R"; PATHS="$PATHS $R"; fi
          done
          if [ -f chain_state.json ]; then PATHS="$PATHS chain_state.json"; fi
          if [ -z "$PATHS" ]; then
            echo "::notice::没有可提交的数据目录"
            exit 0
          fi

          # shellcheck disable=SC2086  # 这里就是要按空格拆
          git add -A -- $PATHS
          if git diff --cached --quiet; then
            echo "无改动"
            exit 0
          fi
          git commit -m "paper: 收尾提交 ${DIRS} $(date '+%Y-%m-%d %H:%M')"

          PUSHED=0
          for i in 1 2 3; do
            # pull 失败不该挡住 push：分支刚建出来时远端还没有这个 ref。
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              || echo "::warning::pull 失败，直接尝试 push"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then PUSHED=1; break; fi
            echo "::warning::第 $i 次 push 失败，3 秒后重试"
            sleep 3
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::推送失败：本轮数据只存在于 runner 上"
            exit 1
          fi

      - name: Trigger Next Workflow (Restart)
        # 只有前面都成功（Python 主动 exit(0)）才交棒。
        # Python 崩了就不交棒，交给 cron 在 13:00 / 17:40 / 08:10 重新拉起 ——
        # 否则一个系统性 bug 会变成无限崩溃循环。
        if: success()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "${PAT_TOKEN}" ]; then
            echo "::error::缺少 secrets.PAT_TOKEN，接力失败（PAT 需要 actions:write + contents:write）"
            echo "::warning::接力链已断，只能等 cron 在 13:00 / 17:40 / 08:10 重新拉起"
            exit 1
          fi
          echo "上一轮已正常结束，正在触发下一轮……"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PAT_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/paper_trade.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ github.run_number }}
          path: |
            paper/logs/*.log
            paper_test/logs/*.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          D=$((10#$(date +%d)))

          # 健康检查：每月 5 号之后，如果上个月的账还没记，就报警。
          WARN=""
          if [ -f paper/state.json ]; then
            LM=$(python -c "import json;print(json.load(open('paper/state.json')).get('last_month') or '')" || true)
            PREV=$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m)
            if [[ "${LM:-0000-00}" < "$PREV" ]] && [ "$D" -ge 5 ]; then
              WARN="上月 $PREV 没有记账记录（last_month=${LM:-空}）"
            fi
          fi

          {
            echo "### paper-chain 本轮摘要"
            echo ""
            echo "- 现在：$(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "- 触发：${{ github.event_name }}（计划='${{ github.event.schedule }}'）"
            if [ -f chain_state.json ]; then
              echo "- 链路状态："
              echo '```json'
              cat chain_state.json
              echo '```'
            fi
            for R in paper paper_test; do
              for PF in ${{ env.PORTFOLIOS }}; do
                if [ -f "$R/n$PF/equity.csv" ]; then
                  echo ""
                  echo "**$R n=$PF**"
                  echo '```'
                  tail -n 3 "$R/n$PF/equity.csv"
                  echo '```'
                fi
              done
            done
            if [ -n "$WARN" ]; then
              echo ""
              echo "**⚠️ $WARN**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$WARN" ]; then echo "::warning::$WARN"; fi
