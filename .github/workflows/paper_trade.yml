name: paper

# ══════════════════════════════════════════════════════════════════════════════
#  和现在线上的区别只有 2 处（跑的内容一字未改）：
#
#  A. 触发窗口从「25-31 号 + 每周一」≈ 19 次/年，改成「每天 2 次」= 730 次/年。
#     GitHub 的 schedule 是 best-effort：**会延迟，也会整次丢弃**。
#     实测同账号的 my-scheduled-task：cron '0 0 * * *' 的实际触发时间
#        10-21 00:23 → 11-01 00:39 → 11-13 00:47 → 11-21 05:39 → 11-23 05:48
#     （延迟从 20 分钟一路漂到 5 小时 48 分）；而 my-scheduled-task2 的
#     '50 6 * * 1' 在 2026-11-23（周一）过了 6.5 小时仍然一条 schedule 记录都没有。
#     —— 窗口越窄，丢一次就等于丢一整个月。改成每天触发，延迟几小时照样落在当天。
#
#  B. 「今天该不该记账」的判断从 YAML 的 cron 挪回脚本本身。
#     paper_trade.py 里本来就有 is_month_end_trading_day() 和 last_month 幂等保护，
#     所以多触发几次绝不会多记账：不是月末最后一个工作日就 [skip] 退出，
#     同一个月已经记过账也会 [skip]。
#     周日到周四触发基本是空跑（40 秒内退出），不浪费额度。
#
#  另外：兜底那一发（09:40 UTC）只补「正式跑」；周一的测试跑主尝试已经做过，
#        不再重复，避免 paper_test 一天两跑。
# ══════════════════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: '50 6 * * *'    # 主尝试：每天 14:50 北京时间
    - cron: '40 9 * * *'    # 兜底：每天 17:40 北京时间（主尝试被丢弃时救场）
  workflow_dispatch:
    inputs:
      force:
        description: '忽略「是否月末最后工作日」检查'
        type: boolean
        default: true
      root:
        description: 'paper_test（测试）或 paper（正式）'
        type: choice
        options: [paper_test, paper]
        default: paper_test

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PORTFOLIOS: "5 10"
  CAND: "20"
  CAPITAL: "200000"
  WINDOW: "20"
  CUT: "2"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: decide
        id: d
        run: |
          set -euo pipefail
          TODAY=$(date +%F)     # TZ=Asia/Shanghai，按北京时间算日期
          WD=$(date +%u)        # 1=周一 … 7=周日
          ROOT=""
          FLAGS=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ROOT="${{ inputs.root }}"
            if [ "${{ inputs.force }}" = "true" ]; then FLAGS="--force"; fi
          else
            # 本月最后一个工作日
            LAST=$(date -d "$(date +%Y-%m-01) +1 month -1 day" +%F)
            while [ "$(date -d "$LAST" +%u)" -ge 6 ]; do
              LAST=$(date -d "$LAST -1 day" +%F)
            done

            if [ "$TODAY" = "$LAST" ]; then
              ROOT="paper"                          # 正式跑；脚本内部还会再校验一次
            elif [ "$WD" = "1" ]; then
              ROOT="paper_test"                     # 周一测试跑
              FLAGS="--force"
            fi

            # 兜底那一发只补正式跑，周测跑不重复
            if [ "${{ github.event.schedule }}" = "40 9 * * *" ] && [ "$ROOT" = "paper_test" ]; then
              ROOT=""
            fi
          fi

          echo "root=$ROOT"   >> "$GITHUB_OUTPUT"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "今天 $TODAY（周$WD），目标目录='${ROOT:-无（跳过）}' 参数='${FLAGS:-无}'"

      - name: run
        if: steps.d.outputs.root != ''
        run: |
          python -u paper_trade.py \
            --root "${{ steps.d.outputs.root }}" \
            --n ${{ env.PORTFOLIOS }} \
            --cand ${{ env.CAND }} \
            --capital ${{ env.CAPITAL }} \
            --window ${{ env.WINDOW }} \
            --cut ${{ env.CUT }} \
            ${{ steps.d.outputs.flags }}

      - name: commit
        if: success() && steps.d.outputs.root != ''
        run: |
          set -e
          ROOT="${{ steps.d.outputs.root }}"
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          if [ ! -d "$ROOT" ]; then
            echo "::warning::$ROOT not created (skipped by date gate)"
            exit 0
          fi
          git add -A -- "$ROOT"
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "paper(${ROOT}): $(date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "::warning::push retry $i"; sleep 3
            done
          fi

      - name: summary
        if: always()
        run: |
          ROOT="${{ steps.d.outputs.root }}"
          {
            echo "### 触发=${{ github.event_name }}  计划='${{ github.event.schedule }}'  目录='${ROOT:-无}'  $(date '+%Y-%m-%d %H:%M %Z')"
            echo ""
            if [ -z "$ROOT" ]; then
              echo "今天不是记账日，本次为空跑（cron 只负责『叫醒』，跑不跑由脚本判断）。"
            else
              for PF in ${{ env.PORTFOLIOS }}; do
                if [ -f "$ROOT/n$PF/equity.csv" ]; then
                  echo "**$ROOT n=$PF**"
                  echo '```'
                  tail -n 5 "$ROOT/n$PF/equity.csv"
                  echo '```'
                fi
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ github.run_number }}
          path: ${{ steps.d.outputs.root }}/logs/*.log
          retention-days: 30
          if-no-files-found: ignore
