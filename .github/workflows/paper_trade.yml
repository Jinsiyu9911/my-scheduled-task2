name: paper

# ════════════════════════════════════════════════════════════════════════════
#  所有可调参数都在这里，改完直接 push 即可生效
# ════════════════════════════════════════════════════════════════════════════
#  cron 用 UTC。北京时间 = UTC + 8，所以北京时间 14:50 = UTC 06:50。
#
#  ┌─ 正式跑：月末最后一个交易日 14:50 ──────────────────────────────┐
#  │  '50 6 25-31 * *'  每月 25~31 日每天触发一次，                    │
#  │                    脚本内部再判断「今天是不是本月最后一个工作日」， │
#  │                    不是就跳过。                                    │
#  └────────────────────────────────────────────────────────────────────┘
#
#  ┌─ 测试跑：每周一 14:50（测完把下面那行删掉）───────────────────┐
#  │  '50 6 * * 1'      写 paper_test/，不影响正式记录                 │
#  └────────────────────────────────────────────────────────────────────┘
on:
  schedule:
    - cron: '50 6 25-31 * *'
    - cron: '50 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'ignore month-end check'
        type: boolean
        default: true
      root:
        description: 'paper_test or paper'
        type: choice
        options: [paper_test, paper]
        default: paper_test

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  # ---- 组合只数（想只跑一个盘就写 "5"）----
  PORTFOLIOS: "5 10"
  # ---- 候选池大小，必须 >= max(PORTFOLIOS) + 5 ----
  CAND: "20"
  # ---- 初始资金（只在第一次运行、paper/ 还没生成时有效）----
  CAPITAL: "200000"
  # ---- 涨停判定：回看多少个交易日 ----
  WINDOW: "20"
  # ---- 涨停次数 >= CUT 就剔除 ----
  CUT: "2"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: args
        id: args
        run: |
          set -e
          ROOT="paper"; FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ROOT="${{ inputs.root }}"
            if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          elif [ "${{ github.event.schedule }}" = "50 6 * * 1" ]; then
            ROOT="paper_test"; FORCE="--force"
          fi
          echo "root=${ROOT}" >> "$GITHUB_OUTPUT"
          echo "flags=${FORCE}" >> "$GITHUB_OUTPUT"
          echo "target=${ROOT}  force=${FORCE:-no}"

      - name: run
        run: |
          python -u paper_trade.py \
            --root "${{ steps.args.outputs.root }}" \
            --n ${{ env.PORTFOLIOS }} \
            --cand ${{ env.CAND }} \
            --capital ${{ env.CAPITAL }} \
            --window ${{ env.WINDOW }} \
            --cut ${{ env.CUT }} \
            ${{ steps.args.outputs.flags }}

      - name: commit
        if: success()
        run: |
          set -e
          ROOT="${{ steps.args.outputs.root }}"
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          if [ ! -d "$ROOT" ]; then
            echo "::warning::$ROOT not created (skipped by date gate)"
            exit 0
          fi
          git add -A -- "$ROOT"
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "paper(${ROOT}): $(date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "::warning::push retry $i"; sleep 3
            done
          fi

      - name: summary
        if: always()
        run: |
          ROOT="${{ steps.args.outputs.root }}"
          {
            echo "### $ROOT  $(date '+%Y-%m-%d %H:%M %Z')"
            echo ""
            for PF in ${{ env.PORTFOLIOS }}; do
              if [ -f "$ROOT/n$PF/equity.csv" ]; then
                echo "**n=$PF**"
                echo '```'
                tail -n 5 "$ROOT/n$PF/equity.csv"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ github.run_number }}
          path: ${{ steps.args.outputs.root }}/logs/*.log
          retention-days: 30
          if-no-files-found: ignore
